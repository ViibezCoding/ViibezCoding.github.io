<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FA9E0"/>
      <stop offset="1" stop-color="#BFE6F7"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E8A39"/>
      <stop offset="1" stop-color="#2F6E2B"/>
    </linearGradient>
    <linearGradient id="fairway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6CBF5A"/>
      <stop offset="1" stop-color="#57A848"/>
    </linearGradient>
    <radialGradient id="ball" cx=".38" cy=".35" r=".7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D5DCE0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <rect y="330" width="1280" height="390" fill="url(#grass)"/>
  <!-- Fairway narrowing to the horizon -->
  <path d="M590 330 L690 330 L1060 720 L220 720 Z" fill="url(#fairway)"/>
  <!-- Yardage lines -->
  <g fill="#FFFFFF" opacity=".45">
    <rect x="605" y="352" width="70" height="2"/>
    <rect x="575" y="390" width="130" height="3"/>
    <rect x="530" y="450" width="220" height="4"/>
    <rect x="455" y="545" width="370" height="5"/>
  </g>
  <!-- Pin -->
  <rect x="742" y="290" width="4" height="56" fill="#F2F2F2"/>
  <path d="M746 292 L782 302 L746 312 Z" fill="#E8443A"/>

  <!-- Ball flight: starts straight, fades right -->
  <path d="M640 640 C 640 420, 700 170, 860 250" fill="none" stroke="#FFF6C2" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
  <circle cx="860" cy="250" r="9" fill="url(#ball)"/>

  <!-- Ball on the tee with the sweet-spot ring -->
  <rect x="636" y="652" width="8" height="26" rx="3" fill="#FFFFFF"/>
  <circle cx="640" cy="640" r="16" fill="url(#ball)"/>
  <circle cx="640" cy="640" r="44" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="4"/>
  <circle cx="640" cy="640" r="78" fill="none" stroke="#FFD84A" stroke-width="7"/>

  <text x="640" y="170" text-anchor="middle" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" font-size="150" font-weight="900" fill="#FFFFFF" stroke="#1D4F2A" stroke-width="10" paint-order="stroke" letter-spacing="-4">Fore!</text>
</svg>
